<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Arah Senja By Alika</title>

  <!-- Menghubungkan index.html dengan style.css -->
  <link rel="stylesheet" href="./style.css?v=20">
</head>

<body>

  <header class="navbar">
    <a href="#beranda" class="logo">
      Arah Senja
      <span>By Alika</span>
    </a>

    <button
      class="menu-toggle"
      id="menuToggle"
      type="button"
      aria-label="Buka menu"
    >
      ☰
    </button>

    <nav class="nav-menu" id="navMenu">
      <a href="#beranda">Beranda</a>
      <a href="#menu">Menu</a>
      <a href="#tentang">Tentang</a>
      <a href="#galeri">Galeri</a>
      <a href="#alamat">Alamat</a>
      <a href="#kontak">Kontak</a>
      
    </nav>
  </header>

  <main>
    <section class="hero" id="beranda">
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <h1>Arah Senja By Alika</h1>
        <p>Temukan Tenangmu.</p>
        <a href="#menu" class="hero-button">Lihat Menu</a>
      </div>
    </section>
    <section id="alamat">
  <h2>Alamat Arah Senja</h2>

  <p>
    Klik tombol di bawah ini untuk melihat lokasi Arah Senja.
  </p>

  <a
    href="https://share.google/fbxtORAG7AROeA0HI"
    target="_blank"
  >
    Buka Google Maps
  </a>
    </section>
  </main>
  

  <script>
    const menuToggle = document.getElementById("menuToggle");
    const navMenu = document.getElementById("navMenu");

    menuToggle.addEventListener("click", function () {
      navMenu.classList.toggle("active");
    });

    document.querySelectorAll(".nav-menu a").forEach(function (link) {
      link.addEventListener("click", function () {
        navMenu.classList.remove("active");
      });
    });
  </script>

</body>
</html>
